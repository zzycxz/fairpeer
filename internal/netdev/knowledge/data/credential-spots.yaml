# 凭据存放点巡检表（BLUETEAM_SKILL_SPEC §5.2 表2）——netdev-seccheck-auto
# 入口=主机 的 H1 层数据。蓝队化改写：只判"存在与暴露"，不取值不破解不外传。
version: 1
source: builtin
spots:
  - id: wifi-saved
    os: [linux, windows]
    check: {linux: "ls -la /etc/NetworkManager/system-connections/", windows: "netsh wlan show profiles"}
    positive: "目录/配置文件存在即阳性"
  - id: gpp-xml
    os: [windows]
    check: {windows: 'Get-ChildItem -Path SYSVOL -Recurse -Filter *.xml -ErrorAction SilentlyContinue | Select-Object -First 5 FullName'}
    positive: "groups.xml/services.xml 存在即阳性（cpassword 历史遗留）"
  - id: ps-history
    os: [windows]
    check: {windows: "Get-ChildItem (Get-PSReadlineOption).HistorySavePath"}
    positive: "历史文件存在且非空即阳性"
  - id: browser-saved
    os: [linux, windows]
    check: {linux: 'ls ~/.config/google-chrome/*/Login\ Data ~/.mozilla/firefox/*/logins.json 2>/dev/null', windows: 'dir /s /b "Login Data" 2>nul'}
    positive: "登录数据库存在即阳性"
  - id: ssh-keys
    os: [linux]
    check: {linux: "ls -la ~/.ssh/"}
    positive: "id_rsa/authorized_keys 存在即阳性（只列不读私钥内容）"
  - id: cloud-creds
    os: [linux, windows]
    check: {linux: "ls ~/.aws/credentials ~/.azure/* ~/.config/gcloud/* 2>/dev/null", windows: "dir /s /b credentials 2>nul"}
    positive: "云凭据文件存在即阳性"
  - id: lsass-reach
    os: [windows]
    check: {windows: "whoami /priv | findstr SeDebugPrivilege"}
    positive: "持有 SeDebugPrivilege=LSASS 可达（只判可达性，绝不转储）"
