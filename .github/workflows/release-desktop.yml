name: Desktop Release

on:
  push:
    tags:
      - 'desktop-v*'

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }}, ${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: darwin/amd64
            artifact: momapeer-macos-intel.zip
            binary_name: momapeer.app
            apt_deps: ''
            build_args: ''

          - os: macos-latest
            platform: darwin/arm64
            artifact: momapeer-macos-silicon.zip
            binary_name: momapeer.app
            apt_deps: ''
            build_args: ''

          - os: windows-latest
            platform: windows/amd64
            artifact: momapeer-windows-amd64.exe
            binary_name: momapeer.exe
            setup_artifact: momapeer-setup-*-amd64.exe
            apt_deps: ''
            build_args: ''

          - os: windows-latest
            platform: windows/arm64
            artifact: momapeer-windows-arm64.exe
            binary_name: momapeer.exe
            setup_artifact: momapeer-setup-*-arm64.exe
            apt_deps: ''
            build_args: ''

          - os: ubuntu-22.04
            platform: linux/amd64
            artifact: momapeer-linux-amd64
            binary_name: momapeer
            apt_deps: 'libgtk-3-dev libwebkit2gtk-4.0-dev x11-utils scrot'
            build_args: ''

          - os: ubuntu-24.04-arm
            platform: linux/arm64
            artifact: momapeer-linux-arm64
            binary_name: momapeer
            apt_deps: 'libgtk-3-dev libwebkit2gtk-4.1-dev x11-utils scrot'
            build_args: '-tags webkit2_41'

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Xcode (macOS)
        if: runner.os == 'macOS'
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Setup LLVM-MinGW (for Windows ARM64 cross-compile)
        if: matrix.platform == 'windows/arm64'
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/mstorsjo/llvm-mingw/releases/download/20231128/llvm-mingw-20231128-ucrt-x86_64.zip" -OutFile llvm-mingw.zip
          Expand-Archive llvm-mingw.zip -DestinationPath C:\llvm-mingw
          Add-Content -Path $env:GITHUB_PATH -Value "C:\llvm-mingw\llvm-mingw-20231128-ucrt-x86_64\bin"

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Linux Dependencies
        if: startsWith(matrix.os, 'ubuntu')
        run: sudo apt-get update && sudo apt-get install -y ${{ matrix.apt_deps }}

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.13.0

      - name: Install UPX
        uses: crazy-max/ghaction-upx@v3
        with:
          install-only: true
        continue-on-error: true

      - name: Inject version from tag
        id: version
        shell: bash
        run: |
          # desktop-v0.1.5 → v0.1.5
          ver="${{ github.ref_name }}"
          ver="${ver#desktop-}"
          echo "semver=$ver" >> "$GITHUB_OUTPUT"

      - name: Build Wails App (Windows ARM64)
        if: matrix.platform == 'windows/arm64'
        working-directory: ./desktop
        shell: bash
        env:
          CC: aarch64-w64-mingw32-gcc
          CXX: aarch64-w64-mingw32-g++
        run: |
          # UPX is disabled for windows/arm64 due to incompatibility
          wails build -platform ${{ matrix.platform }} -clean ${{ matrix.build_args }} -ldflags "-s -w -X main.version=${{ steps.version.outputs.semver }}" -v 2 | tee wails_build.log
          if [ ${PIPESTATUS[0]} -ne 0 ]; then echo "Wails build failed"; exit 1; fi

      - name: Build Wails App (Others)
        if: matrix.platform != 'windows/arm64'
        working-directory: ./desktop
        shell: bash
        run: |
          UPX_FLAG=""
          if command -v upx &> /dev/null; then UPX_FLAG="-upx"; fi
          wails build -platform ${{ matrix.platform }} -clean ${{ matrix.build_args }} -ldflags "-s -w -X main.version=${{ steps.version.outputs.semver }}" $UPX_FLAG -v 2 | tee wails_build.log
          if [ ${PIPESTATUS[0]} -ne 0 ]; then
            echo "Wails build failed"
            exit 1
          fi

      - name: Upload Build Log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: wails-build-log-${{ matrix.os }}
          path: ./desktop/wails_build.log

      - name: Compress macOS app
        if: runner.os == 'macOS'
        working-directory: ./desktop/build/bin
        run: zip -r ${{ matrix.artifact }} ${{ matrix.binary_name }}

      - name: Rename Artifact (Linux)
        if: startsWith(matrix.os, 'ubuntu')
        working-directory: ./desktop/build/bin
        run: mv ${{ matrix.binary_name }} ${{ matrix.artifact }}

      - name: Verify Windows binary exists
        if: runner.os == 'Windows'
        working-directory: ./desktop
        shell: pwsh
        run: |
          Write-Output "Listing ./build/bin directory for debugging:"
          Get-ChildItem -Path ./build/bin
          if (-not (Test-Path "./build/bin/momapeer.exe")) {
            Write-Output "⚠️ Binary not found! Attempting to locate any exe in the directory."
            $exeFiles = Get-ChildItem -Path ./build/bin/*.exe
            foreach ($file in $exeFiles) {
              Write-Output "Found $($file.Name), copying to expected name..."
              Copy-Item $file.FullName -Destination "./build/bin/momapeer.exe"
            }
          }
          if (-not (Test-Path "./build/bin/momapeer.exe")) {
            Write-Error "❌ Still missing after fallback. Failing job."
            exit 1
          }

      - name: Build NSIS Installer (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: ./desktop
        run: |
          # Install NSIS
          choco install nsis -y --no-progress
          # Update version in installer script
          $ver = "${{ steps.version.outputs.semver }}"
          (Get-Content scripts\installer.nsi) -replace '!define APP_VERSION ".*"', "!define APP_VERSION `"$ver`"" | Set-Content scripts\installer.nsi
          # Build installer
          & "C:\Program Files (x86)\NSIS\makensis.exe" scripts\installer.nsi
          # Rename with version and arch
          $arch = "${{ matrix.platform }}".Replace("windows/", "")
          $setupName = "momapeer-setup-$ver-$arch.exe"
          if (Test-Path "build\bin\momapeer-setup.exe") {
            Rename-Item "build\bin\momapeer-setup.exe" "$setupName"
          } else {
            Write-Error "NSIS installer not created"
            exit 1
          }

      - name: Upload Artifact (Windows)
        if: runner.os == 'Windows'
        uses: softprops/action-gh-release@v2
        with:
          name: momapeer ${{ github.ref_name }}
          make_latest: true
          body: |
            ## MoMAPeer Desktop ${{ github.ref_name }}

            See [CHANGELOG.md](https://github.com/zzycxz/momapeer/blob/main/CHANGELOG.md) for details.
          files: ./desktop/build/bin/${{ matrix.setup_artifact }}

      - name: Upload Artifact (macOS/Linux)
        if: runner.os != 'Windows'
        uses: softprops/action-gh-release@v2
        with:
          name: momapeer ${{ github.ref_name }}
          make_latest: true
          body: |
            ## MoMAPeer Desktop ${{ github.ref_name }}

            See [CHANGELOG.md](https://github.com/zzycxz/momapeer/blob/main/CHANGELOG.md) for details.
          files: ./desktop/build/bin/${{ matrix.artifact }}

  manifest:
    name: Generate Auto-Updater Manifest
    needs: build
    if: always() && needs.build.result != 'cancelled'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Download release artifacts (exclude stale signatures)
        run: |
          mkdir -p release-assets
          gh release download ${{ github.ref_name }} --dir release-assets --pattern 'momapeer-*' --pattern 'latest.json' || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Sign artifacts
        env:
          MINISIGN_PRIVATE_KEY: ${{ secrets.MINISIGN_PRIVATE_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
        run: |
          if [ -z "$MINISIGN_PRIVATE_KEY" ] || [ -z "$MINISIGN_PASSWORD" ]; then
            echo "MINISIGN secrets not configured, skipping signing"
            exit 0
          fi
          cd desktop
          go run ./cmd/sign sign ../release-assets/*

      - name: Generate Manifest
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#desktop-}"
          cd desktop
          go run ./cmd/sign manifest ../release-assets "$VERSION" "${{ github.ref_name }}"

      - name: Upload Manifest
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/latest.json

      - name: Upload Signatures (separate release)
        if: hashFiles('release-assets/*.minisig') != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}-sigs
          name: ${{ github.ref_name }} signatures
          prerelease: false
          make_latest: false
          files: release-assets/*.minisig

      - name: Sync Release to Gitee
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          if [ -z "$GITEE_TOKEN" ]; then
            echo "No GITEE_TOKEN found. Skipping Gitee Release."
            exit 0
          fi
          
          TAG="${{ github.ref_name }}"
          REPO="zzycxz/momapeer"
          
          echo "Pushing directly to Gitee to sync..."
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git remote add gitee "https://oauth2:${GITEE_TOKEN}@gitee.com/$REPO.git" || true
          export GIT_TERMINAL_PROMPT=0
          export GIT_ASKPASS=/bin/echo
          git -c credential.helper= push -f gitee HEAD:refs/heads/main || true
          git -c credential.helper= push -f gitee $TAG || true
          
          echo "Checking if Gitee release exists..."
          EXISTING_ID=$(curl -s "https://gitee.com/api/v5/repos/$REPO/releases/tags/$TAG?access_token=$GITEE_TOKEN" | jq -r .id)
          if [ "$EXISTING_ID" != "null" ] && [ -n "$EXISTING_ID" ]; then
            echo "Deleting existing release $EXISTING_ID..."
            curl -s -X DELETE "https://gitee.com/api/v5/repos/$REPO/releases/$EXISTING_ID" -d "access_token=$GITEE_TOKEN"
          fi
          
          echo "Creating new release for $TAG..."
          CREATE_RES=$(curl -s -X POST "https://gitee.com/api/v5/repos/$REPO/releases" \
            -d "access_token=$GITEE_TOKEN" \
            -d "tag_name=$TAG" \
            -d "name=$TAG" \
            -d "target_commitish=${{ github.sha }}" \
            -d "body=✨ Release auto-synced from GitHub Actions")
          
          RELEASE_ID=$(echo "$CREATE_RES" | jq -r .id)
          if [ "$RELEASE_ID" == "null" ] || [ -z "$RELEASE_ID" ]; then
            echo "Failed to create release: $CREATE_RES"
            exit 1
          fi
          
          echo "Created Gitee Release ID: $RELEASE_ID"
          
          for file in release-assets/*; do
            if [ -f "$file" ]; then
              echo "Uploading $file..."
              UPLOAD_RES=$(curl -s -X POST "https://gitee.com/api/v5/repos/$REPO/releases/$RELEASE_ID/attach_files" \
                -F "access_token=$GITEE_TOKEN" \
                -F "file=@$file")
              echo "Upload result: $UPLOAD_RES"
            fi
          done
