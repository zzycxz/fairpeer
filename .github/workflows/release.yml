name: Release Desktop

on:
  push:
    tags:
      - 'v*'
      - 'V*'
      - 'desktop-v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            platform: windows/amd64
            ext: .exe
          - os: windows-latest
            platform: windows/arm64
            ext: .exe
          - os: macos-latest
            platform: darwin/amd64
            ext: .app
          - os: macos-latest
            platform: darwin/arm64
            ext: .app
          - os: ubuntu-latest
            platform: linux/amd64
            ext: ""
          - os: ubuntu-24.04-arm
            platform: linux/arm64
            ext: ""
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup System Deps (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.13.0

      - name: Build Frontend
        working-directory: desktop/frontend
        run: npm install

      - name: Build Wails App
        working-directory: desktop
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            wails build -platform ${{ matrix.platform }} -clean -trimpath -ldflags "-X main.version=${{ github.ref_name }}" -webview2 embed -nsis
          elif [ "${{ runner.os }}" = "Linux" ]; then
            wails build -platform ${{ matrix.platform }} -clean -trimpath -ldflags "-X main.version=${{ github.ref_name }}" -tags webkit2_41
          else
            wails build -platform ${{ matrix.platform }} -clean -trimpath -ldflags "-X main.version=${{ github.ref_name }}"
          fi

      - name: Package Artifact
        working-directory: desktop/build/bin
        shell: bash
        run: |
          PLAT_NAME=$(echo "${{ matrix.platform }}" | tr '/' '-')
          if [ "${{ runner.os }}" = "Windows" ]; then
            if ls *-installer.exe 1> /dev/null 2>&1; then
              mv *-installer.exe fairpeer-${PLAT_NAME}.exe
              rm -f fairpeer.exe
            else
              mv fairpeer.exe fairpeer-${PLAT_NAME}.exe
            fi
          elif [ "${{ runner.os }}" = "macOS" ]; then
            # Compress .app to tar.gz to preserve permissions
            tar -czf fairpeer-${PLAT_NAME}.tar.gz fairpeer.app
          else
            # Linux produces a binary without extension
            tar -czf fairpeer-${PLAT_NAME}.tar.gz fairpeer
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-artifact-${{ matrix.os }}-${{ strategy.job-index }}
          path: |
            desktop/build/bin/*.exe
            desktop/build/bin/*.tar.gz
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: desktop/build/bin
          pattern: build-artifact-*
          merge-multiple: true

      - name: Sign and Generate latest.json
        working-directory: desktop
        env:
          MINISIGN_PRIVATE_KEY: ${{ secrets.MINISIGN_PRIVATE_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          tag="${{ github.ref_name }}"
          # The cmd/sign requires bash or sh to glob, so we'll just run it with bash
          go run ./cmd/sign sign build/bin/*
          go run ./cmd/sign manifest build/bin $tag $tag
        shell: bash

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            desktop/build/bin/*.exe
            desktop/build/bin/*.tar.gz
            desktop/build/bin/*.minisig
            desktop/build/bin/latest.json
          generate_release_notes: true
