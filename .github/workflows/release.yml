name: Release Desktop

on:
  push:
    tags:
      - 'v*'
      - 'V*'
      - 'desktop-v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.13.0

      - name: Build Frontend
        working-directory: desktop/frontend
        run: npm install

      - name: Build Wails App
        working-directory: desktop
        run: wails build -webview2 embed

      - name: Sign and Generate latest.json
        working-directory: desktop
        env:
          MINISIGN_PRIVATE_KEY: ${{ secrets.MINISIGN_PRIVATE_KEY }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          # Parse version from tag
          $tag = "${{ github.ref_name }}"
          # Call the sign tool
          go run ./cmd/sign manifest build/bin $tag $tag

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            desktop/build/bin/fairpeer.exe
            desktop/build/bin/fairpeer.exe.minisig
            desktop/build/bin/latest.json
          generate_release_notes: true
