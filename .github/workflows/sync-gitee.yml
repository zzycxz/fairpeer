name: Sync to Gitee

on:
  push:
    branches: [main, 'feat/**', 'fix/**']
  delete:
    branches: ['**']

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Strip LFS history to bypass Gitee limits
        run: |
          pipx install git-filter-repo
          # 1. 移除整个历史中的 .gitattributes 文件
          git filter-repo --force --path .gitattributes --invert-paths
          # 2. 修改所有 LFS 指针文件的二进制特征，让 Gitee 识别为普通文本
          git filter-repo --force --blob-callback '
            if b"version https://git-lfs.github.com/spec/v1" in blob.data:
              blob.data = blob.data.replace(b"version https://git-lfs.github.com/spec/v1", b"version https://disabled-lfs/spec/v1")
          '

      - name: Sync to Gitee
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          # Configure Gitee remote with token auth
          git remote add gitee https://oauth2:${GITEE_TOKEN}@gitee.com/zzycxz/momapeer.git 2>/dev/null || \
            git remote set-url gitee https://oauth2:${GITEE_TOKEN}@gitee.com/zzycxz/momapeer.git

          # Disable LFS for this push (Gitee free doesn't support LFS)
          # This prevents git from trying to upload LFS objects
          git lfs install --local --skip-smudge --skip-repo
          export GIT_LFS_SKIP_PUSH=1

          # Push main branch
          git push gitee main --force

          # Push tags
          git push gitee --tags --force

      - name: Delete remote branch on Gitee (if deleted on GitHub)
        if: github.event_name == 'delete'
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          BRANCH="${{ github.event.ref }}"
          curl -X DELETE \
            "https://gitee.com/api/v5/repos/zzycxz/momapeer/branches/${BRANCH}" \
            -d "access_token=${GITEE_TOKEN}" || true
