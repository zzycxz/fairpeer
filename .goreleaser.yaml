version: 2
project_name: momapeer

before:
  hooks:
    - go mod download

builds:
  - id: momapeer
    main: ./cmd/momapeer
    binary: momapeer
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Tag }}
    goos: [darwin, linux, windows]
    goarch: [amd64, arm64]

archives:
  - id: momapeer
    ids: [momapeer]
    name_template: "momapeer-{{ .Os }}-{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: SHA256SUMS
  algorithm: sha256

homebrew_casks:
  - name: momapeer
    ids: [momapeer]
    # Prereleases (v*-rc*) must not update the stable tap; brew has no separate
    # prerelease channel, so a pushed rc cask becomes the default `brew install`.
    # npm is a separate line (release-npm.yml, `npm-v*`), so an npm prerelease no
    # longer drags brew along — a stable `v*` cask can ship while npm stays on rc.
    skip_upload: "auto"
    repository:
      owner: zzycxz
      name: homebrew-momapeer
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    homepage: "https://github.com/zzycxz/momapeer"
    description: "A MoMA (九天) AI coding agent for the terminal."
    commit_author:
      name: momapeer
      email: momapeer@users.noreply.github.com
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/momapeer"]
          end

changelog:
  sort: asc
  filters:
    exclude:
      - "^ci:"
      - "^docs:"
      - "^chore:"
      - "^test:"
      - "^style:"

release:
  prerelease: false
  make_latest: false
  name_template: "momapeer CLI {{ .Tag }}"
