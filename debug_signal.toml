# M2 联调用 signal 配置。监听 0.0.0.0:8080 让手机（同 WiFi）能访问 K。
# 生产部署用 deploy/linkpeer-signal/signal.toml（Caddy + coturn + 限流调优）。
# 其余字段走 DefaultConfig（PROTOCOL §10.4 的 5000-peer 调优默认）。

[server]
listen = "0.0.0.0:8080"

[pair]
# 联调放宽：1 小时 TTL + 高并发/限速（联调反复 StartPairing，默认 3/5 太紧）。
code_ttl = 3600
max_concurrent_per_dev = 100
max_per_dev_per_hour = 10000
max_fail_per_ip_per_hour = 10000

[log]
level = "info"
