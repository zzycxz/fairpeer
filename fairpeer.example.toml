# fairpeer configuration.
# Resolution order: flag > ./fairpeer.toml > ~/.config/fairpeer/config.toml > built-in defaults.
# Secrets come from the environment via api_key_env; never put keys here.

# default_model = "<provider>/<model>"   # uncomment + set after configuring a provider
# language      = "zh"   # ui language; empty = auto-detect from $LANG / $FAIRPEER_LANG

[ui]
theme = "auto"   # auto|dark|light; controls CLI colors only; FAIRPEER_THEME can override per run
# theme_style = "graphite"   # graphite|aurora|slate|carbon|nocturne|amber|ember|midnight|sandstone|porcelain|linen|glacier
# shortcut_layout = "desktop"   # classic|desktop; compatibility setting; Shift+Tab toggles Plan, Ctrl+Y toggles YOLO

[notifications]
enabled = false   # system notifications for CLI chat/run; default off
turn_done = true   # notify when a turn finishes
approval_request = true   # notify when a tool approval is waiting
ask_request = true   # notify when a question is waiting

[agent]
system_prompt = """
You are fairpeer, a coding agent focused on executing code tasks.
Use the provided tools to read and write files and run shell commands.
When asked about your identity, always say you are fairpeer. Never mention
Claude, Anthropic, GPT, Qwen, DeepSeek, or any underlying model name —
you are fairpeer, not any foundation model.
Principles: understand the request before acting; verify with tools instead of
guessing; keep changes minimal and correct; briefly summarize what you did."""
# system_prompt_file = "prompts/system.md"   # overrides system_prompt when set
max_steps         = 0    # executor tool-call rounds; 0 = no limit
planner_max_steps = 12   # planner read-only tool-call rounds; 0 = no limit
temperature       = 0.0
auto_plan         = "off"   # off|on; off keeps plan mode manual
# auto_plan_classifier = "<provider>/<model>"   # optional; only used for borderline tasks
soft_compact_ratio  = 0.5   # notice only; keeps the cache-first prefix intact
compact_ratio       = 0.8   # try compacting when prompt reaches this fraction
compact_force_ratio = 0.9   # force compacting at this high-water mark
# context_budget_percent = 80   # cap the effective window for compaction (0/100 = full). Lower = compact earlier — saves cost on input pricing tiers and avoids quality drop near the window edge.
# fast_task_model = "<provider>/<model>"   # lightweight model for background tasks (dream/distill/rag-extract)
# planner_model = "<provider>/<model>"   # optional: enable two-model collaboration
# subagent_model = "<provider>/<model>"   # optional default for runAs=subagent skills
# subagent_models = { review = "<provider>/<model>", security_review = "<provider>/<model>" }   # per-skill overrides
# output_style = "explanatory"   # persona/tone folded into the prompt: explanatory | learning | concise,
#                                  or a custom .fairpeer/output-styles/<name>.md ; empty = default

# A provider is a vendor endpoint (one base_url + key) that offers one or more
# models. Use `models = [...]` to expose several under a single entry — switching
# models reuses the same connection; no need to re-declare base_url/api_key.
# Uncomment the providers you have an API key for. FairPeer ships NO built-in
# provider — configure at least one before first run (or use `fairpeer setup`).
# Keyless local presets (Ollama, llama.cpp) ship built-in for every install —
# they need no API key and appear below under "Local models". Defining ANY
# [[providers]] block here replaces the built-in presets wholesale.

# ── Direct providers (12 vendors) ──────────────────────────────────────────
# Each shows the three model roles: default (main chat), fast (background
# tasks), vision (image recognition). Adjust models as vendors release newer
# ones — run `fairpeer setup` or the Settings "fetch models" button to
# auto-discover available models from a configured endpoint.

# ── 通义千问 (Qwen / DashScope) ──
# [[providers]]
# name        = "qwen"
# kind        = "openai"
# base_url    = "https://dashscope.aliyuncs.com/compatible-mode/v1"
# api_key_env = "QWEN_API_KEY"
# default     = "qwen3.7-max"          # 1M context, thinking
# fast_model  = "qwen3.6-flash"        # 1M, fast/cheap
# models      = ["qwen3.7-max", "qwen3.7-plus", "qwen3.6-flash"]
# vision      = true                    # qwen3.7-plus has integrated vision
# context_window = 1000000

# ── DeepSeek ── (no Coding Plan, pure pay-per-token)
# [[providers]]
# name        = "deepseek"
# kind        = "openai"
# base_url    = "https://api.deepseek.com"
# api_key_env = "DEEPSEEK_API_KEY"
# default     = "deepseek-v4-pro"       # 1M, native multimodal
# fast_model  = "deepseek-v4-flash"     # 1M, very cheap
# models      = ["deepseek-v4-pro", "deepseek-v4-flash"]
# vision      = true
# context_window = 1000000

# ── 火山引擎 (Volcengine / Doubao) ──
# [[providers]]
# name        = "volcengine"
# kind        = "openai"
# base_url    = "https://ark.cn-beijing.volces.com/api/v3"
# api_key_env = "VOLCENGINE_API_KEY"
# default     = "doubao-seed-evolving"  # 1M, Coding & Agent
# fast_model  = "doubao-seed-2.1-turbo" # 256K
# models      = ["doubao-seed-evolving", "doubao-seed-2.1-turbo"]
# vision      = true
