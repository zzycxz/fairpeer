# ── Local models (no API key) ──────────────────────────────────────────────
# Local OpenAI-compatible servers. No api_key_env — requests carry an empty
# Bearer header the server ignores. Run `fairpeer setup` or the Settings
# "fetch models" button to list what's actually installed/loaded.

# ── Ollama ── `ollama serve` on the default port; models listed by `ollama list`
# [[providers]]
# name        = "ollama"
# kind        = "openai"
# base_url    = "http://127.0.0.1:11434/v1"
# default     = "qwen3-coder:30b"
# fast_model  = "qwen3:8b"
# models      = ["qwen3-coder:30b", "qwen3:8b"]
# context_window = 8192               # raise if you bump OLLAMA_CONTEXT_LENGTH/num_ctx

# ── llama.cpp ── `llama-server` (add --jinja for tool calling); serves whatever
# GGUF was loaded, the `model` field is a placeholder — fetch models to see it.
# [[providers]]
# name        = "llamacpp"
# kind        = "openai"
# base_url    = "http://127.0.0.1:8080/v1"
# default     = "local-model"
# models      = ["local-model"]
# context_window = 8192               # match your --ctx-size

# ── Coding Plan aggregators (7 platforms) ──────────────────────────────────
# These are model-aggregation platforms: one endpoint+key calls multiple
# vendors' models. coding_only = consumes Coding Plan subscription quota (vs
# token quota). aggregator = UI groups under "aggregators". Same provider as
# a direct endpoint? Add a second [[providers]] entry — they share nothing
# but the name prefix you choose.

# ── 通义千问 Coding Plan ── (aggregator: qwen/kimi/glm/minimax)
