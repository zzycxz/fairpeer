# coturn configured as STUN-only. The pure-P2P decision means NO relay.
# no-udp-relay + no-tcp-relay force coturn to answer STUN binding requests
# only — it can never relay media. This is the server-side enforcement of
# "business traffic never traverses the cloud" (PROTOCOL §1.1, §10.3).
#
# If you later opt into TURN (PROTOCOL §4.4 opt-in), remove those two lines
# and open the relay port range (49152-65535/udp) + TLS port 5349.

listening-port=3478
listening-ip=0.0.0.0
fingerprint
lt-cred-mech=false            # STUN needs no auth
no-multicast-peers
no-cli
no-tls
no-dtls
no-tcp-relay                  # force STUN-only
no-udp-relay                  # force STUN-only ← key: no media relay ever
stale-nonce=600
max-allocate-timeout=3
log-file=stdout
simple-log
